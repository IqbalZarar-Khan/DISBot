# Docker Compose — Self-hosted DISBot + PostgreSQL + PostgREST
#
# Bundles everything needed to run without Supabase Cloud:
#   • PostgreSQL 16       — stores posts, members, tier mappings
#   • PostgREST           — provides the REST API the Supabase JS SDK expects
#   • DISBot              — the bot itself
#
# Usage:
#   1. Copy .env.example to .env and fill in your credentials
#   2. docker compose up -d
#   3. docker compose exec bot npm run deploy-commands
#
# The database is automatically initialized on first start via docker/init.sql.

services:
  # ── PostgreSQL ────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: disbot
      POSTGRES_USER: disbot
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U disbot -d disbot" ]
      interval: 5s
      timeout: 3s
      retries: 5

  # ── PostgREST (REST API layer) ────────────────────────────────────
  postgrest:
    image: postgrest/postgrest:v12.2.3
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGRST_DB_URI: postgres://disbot:${DB_PASSWORD:-changeme}@db:5432/disbot
      PGRST_DB_SCHEMAS: public
      PGRST_DB_ANON_ROLE: disbot
      PGRST_JWT_SECRET: ${POSTGREST_JWT_SECRET:-super-secret-jwt-token-for-local-dev-min-32-chars}

  # ── DISBot ────────────────────────────────────────────────────────
  bot:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      postgrest:
        condition: service_started
    env_file: .env
    environment:
      # Point the Supabase JS SDK at the local PostgREST instance
      SUPABASE_URL: http://postgrest:3000
      SUPABASE_KEY: ${POSTGREST_JWT_SECRET:-super-secret-jwt-token-for-local-dev-min-32-chars}
      WEBHOOK_PORT: "3000"
      NODE_ENV: production
    ports:
      - "${WEBHOOK_PORT:-3000}:3000"

volumes:
  pgdata:
