# Nginx Configuration for DISBot
# Place this file at: /etc/nginx/sites-available/disbot
# Then create symlink: ln -s /etc/nginx/sites-available/disbot /etc/nginx/sites-enabled/

server {
    listen 80;
    server_name bot.yourdomain.com;  # Replace with your domain

    # Redirect HTTP to HTTPS (after SSL is configured)
    # Uncomment after running certbot
    # return 301 https://$server_name$request_uri;

    # Proxy to Node.js application
    location / {
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        
        # WebSocket support (if needed in future)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        
        # Standard proxy headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Disable caching for dynamic content
        proxy_cache_bypass $http_upgrade;
        
        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Health check endpoint
    location /health {
        proxy_pass http://localhost:3000/health;
        access_log off;
    }

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Logging
    access_log /var/log/nginx/disbot-access.log;
    error_log /var/log/nginx/disbot-error.log;
}

# HTTPS configuration (automatically added by certbot)
# After running: certbot --nginx -d bot.yourdomain.com
# Certbot will add the SSL configuration here
